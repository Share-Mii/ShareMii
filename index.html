<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem('sharemii-theme') ||
            localStorage.getItem('miishare-theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          else document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="ShareMii.net — community Mii QR code gallery and online Mii Maker for 3DS, Wii U, and Tomodachi Life. Not a Switch save editor."
    />
    <meta property="og:site_name" content="ShareMii.net" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ShareMii.net — Browse, Share &amp; Scan Mii QR Codes"
    />
    <meta
      property="og:description"
      content="ShareMii.net — community Mii QR code gallery and online Mii Maker for 3DS, Wii U, and Tomodachi Life."
    />
    <meta property="og:url" content="https://sharemii.net/" />
    <meta
      property="og:image"
      content="https://sharemii.net/assets/og-default.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://sharemii.net/assets/og-default.png"
    />
    <meta
      name="twitter:title"
      content="ShareMii.net — Browse, Share &amp; Scan Mii QR Codes"
    />
    <meta
      name="twitter:description"
      content="ShareMii.net — community Mii QR code gallery and online Mii Maker for 3DS, Wii U, and Tomodachi Life."
    />
    <link rel="canonical" href="https://sharemii.net/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ShareMii.net — Browse, Share &amp; Scan Mii QR Codes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"

      onload="this.media='all'"
    />

      <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
