<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem('sharemii-theme') ||
            localStorage.getItem('miishare-theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          else if (matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse, share, and create Nintendo Miis with the ShareMii community."
    />
    <meta property="og:site_name" content="ShareMii" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ShareMii</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
