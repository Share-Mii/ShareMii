<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Sign in to ShareMii.net</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f1f8;font-family:'Nunito',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1a1a2e;-webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f3f1f8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
          <tr>
            <td style="padding:0 0 20px;text-align:center;">
              <a href="{{ .SiteURL }}" style="text-decoration:none;display:inline-block;font-size:22px;font-weight:800;color:#1a1a2e;letter-spacing:-0.02em;">ShareMii.net</a>
            </td>
          </tr>
          <tr>
            <td style="border-radius:18px;overflow:hidden;border:1px solid #e5e7eb;background-color:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,0.04);">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="padding:28px 28px 24px;background:linear-gradient(180deg,#e6f4fe 0%,#c8e8ff 100%);border-bottom:1px solid #e5e7eb;">
                    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:800;color:#1a1a2e;letter-spacing:-0.02em;">Sign in to ShareMii.net</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:28px;">
                    <p style="margin:0 0 16px;font-size:16px;line-height:1.55;color:#1a1a2e;">
                      Tap the button below to sign in as <strong>{{ .Email }}</strong>. This link expires soon.
                    </p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
                      <tr>
                        <td align="center" style="border-radius:999px;background-color:#0088ff;">
                          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;line-height:1;color:#ffffff;text-decoration:none;border-radius:999px;">Sign in</a>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:0;font-size:13px;line-height:1.55;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#0088ff;text-decoration:underline;">{{ .ConfirmationURL }}</a></p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 8px 0;text-align:center;">
              <p style="margin:0;font-size:13px;line-height:1.55;color:#6b7280;">Did not request this? Ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
